<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let i = 0;
        let isFirst = true;

        function inc() {
            if (i < 10) {
                
                console.log(i);
                i++;
            }
            else {
                if (isFirst == false) {

                    console.log("limit reached");
                    isFirst = false;
                }
            }

        }

        function dec() {
            i--;
            console.log(i);
            isFirst = true;

        }
    </script>
</head>

<body>

    <button onclick="inc()">click ++</button>
    <button onclick="dec()">click --</button>
    <div class="onclick"></div>


</body>

</html>
