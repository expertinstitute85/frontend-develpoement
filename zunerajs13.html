<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let i = 0;
        let limitreached= false;

        function inc() {
            if(i<10){
                i++;
                console.log(i);
            }
            else if(i==10){

                console.log("limit reached"); 
                limitreached 
            }

        }
        function dec() {
            i--;
            console.log(i);  
        }


    </script>
</head>

<body>
    <button onclick="inc()">click ++</button>
    <button onclick="dec()">click --</button>
</body>

</html>
