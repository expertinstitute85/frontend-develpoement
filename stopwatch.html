<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        let seconds = 0;
        let minutes = 0;
        let hours = 0;
        let timer;

        function start() {
            timer = setInterval(function() {
                seconds++;

                if (seconds == 60) {
                    seconds = 0;
                    minutes++;
                }

                else if (minutes == 60) {
                    minutes = 0;
                    hours++;
                }

                document.getElementById("time").innerHTML =
                    hours + ":" + minutes + ":" + seconds;

            }, 1000);
        }

        function stop() {
            clearInterval(timer);
        }

        function reset() {
            clearInterval(timer);

            seconds = 0;
            minutes = 0;
            hours = 0;

            document.getElementById("time").innerHTML = `${hours}:${minutes}:${seconds}`;
        }
    </script>

  
</head>
<body class=" flex justify-center items-center flex-col gap-5">
     <h1 class="text-3xl">Stopwatch</h1>

    <h2 id="time" class="text-3xl">0:0:0</h2>

    <button onclick="start()" class="w-20 h-20 bg-green-100 rounded-2xl text-3xl">Start</button>
    <button onclick="stop()" class="w-20 h-20 bg-red-100 rounded-2xl text-3xl">Stop</button>
    <button onclick="reset()" class="w-20 h-20 bg-blue-100 rounded-2xl text-3xl">Reset</button>


</body>
</html>
